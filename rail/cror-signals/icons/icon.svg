<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- master app icon: a two-lamp signal mast (green over red) on near-black.
       Content sits inside the maskable safe zone (centre ~80%). -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="75%">
      <stop offset="0%" stop-color="#0e1622"/>
      <stop offset="60%" stop-color="#0a0f16"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- pole + base -->
  <rect x="247" y="150" width="18" height="250" rx="4" fill="#46586e"/>
  <rect x="206" y="392" width="100" height="20" rx="6" fill="#46586e"/>
  <!-- lamp housings -->
  <circle cx="256" cy="168" r="58" fill="#0a0f16" stroke="#2c3340" stroke-width="6"/>
  <circle cx="256" cy="300" r="58" fill="#0a0f16" stroke="#2c3340" stroke-width="6"/>
  <!-- green over red -->
  <circle cx="256" cy="168" r="46" fill="#27d65a" filter="url(#glow)"/>
  <circle cx="256" cy="300" r="46" fill="#ff453a"/>
  <!-- highlights -->
  <circle cx="240" cy="152" r="12" fill="#ffffff" opacity="0.5"/>
  <circle cx="240" cy="284" r="12" fill="#ffffff" opacity="0.35"/>
</svg>
