<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 306">
  <!-- Lesson "Six-figure grid references", worked example 984531 (the NRCan worked example of
       Topographic Maps: The Basics p.4, reused with its numbers only, D-060). Gridline's own
       drawing, from the approved G1 figure (mockups/G1-gridline-field.html): two by two squares,
       square 9853 shaded, the cabin 4 tenths east of line 98 and 1 tenth north of line 53
       (the subject of the worked example; the NRCan example names none). The lesson also shows it in
       its teaching point "Name the square", before the first generated check.
       Shown through <img>, so it carries its own ground and Field palette values, light by default
       and dark under prefers-color-scheme (BACKLOG R-02; mockups/field-palette.css, D-068). Every
       line, mark and label is a functional graphic (D-079): grid lines are the survey-blue token,
       the shade is the signal-tint token, labels are the ink or muted token;
       tests/grid-lesson-layout.test.ts measures each one on the ground it touches, in both themes.
       No double hyphen may stand in this comment: an SVG shown through <img> must be well-formed
       XML, and XML forbids one inside a comment (tests/lesson-files.test.ts). -->
  <style>
    .bg { fill: #FCFCF8; }
    .target { fill: #E3E9C2; }
    .grid { fill: none; stroke: #1F8599; stroke-width: 1.5; }
    .tick { fill: none; stroke: #5E5952; stroke-width: 1; }
    .guide { fill: none; stroke: #404B18; stroke-width: 2; stroke-dasharray: 4 3; }
    .dim { fill: none; stroke: #151A12; stroke-width: 1; }
    .ring { fill: none; stroke: #404B18; stroke-width: 2; }
    .point { fill: #151A12; }
    .t { font-family: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; fill: #151A12; }
    .m { font-family: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12px; fill: #5E5952; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1D2119; }
      .target { fill: #2B2E1C; }
      .grid { stroke: #2090A6; }
      .tick { stroke: #A8A29A; }
      .guide { stroke: #B0BC75; }
      .dim { stroke: #E3E6DA; }
      .ring { stroke: #B0BC75; }
      .point { fill: #E3E6DA; }
      .t { fill: #E3E6DA; }
      .m { fill: #A8A29A; }
    }
  </style>
  <rect class="bg" width="330" height="306"/>
  <rect class="target" x="179" y="10" width="135" height="135"/>
