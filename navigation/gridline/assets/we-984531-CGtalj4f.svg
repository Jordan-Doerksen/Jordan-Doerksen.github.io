  <text class="t" x="248" y="120">Cabin</text>
  <text class="m" x="210" y="174" text-anchor="middle">4 tenths</text>
  <text class="m" x="162" y="142" text-anchor="end">1 tenth</text>
  <text class="t" x="44" y="298" text-anchor="middle">97</text>
  <text class="t" x="179" y="298" text-anchor="middle">98</text>
