<svg viewBox="0 0 1000 430" role="img" aria-label="Glass Atlas data flow. A seed arrives from the URL hash or a fresh random and reseeds the hand-rolled mulberry32 PRNG. generate(seed) deterministically derives the plate's stars, nebula colors, and catalog names; drawBase() renders the static layer to an offscreen canvas, and the compositor blends that base with live twinkle each frame. The compositor writes the seed into the URL hash in base-36 — the next visit reads it back for the same plate — and the S key exports the plate as a PNG." xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ga-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-arrow-a"/></marker>
    <marker id="ga-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="dg-arrow-m"/></marker>
  </defs>

  <!-- edges -->
  <g class="dg-edge gold e-seed e-prng"><path d="M230 119 H286" marker-end="url(#ga-a)"/><text x="258" y="83" text-anchor="middle">reseeds</text></g>
  <g class="dg-edge gold e-prng e-gen"><path d="M490 119 H541" marker-end="url(#ga-a)"/><text x="515" y="83" text-anchor="middle">draws</text></g>
  <g class="dg-edge gold e-gen e-base"><path d="M745 119 H791" marker-end="url(#ga-a)"/><text x="768" y="83" text-anchor="middle">plate content</text></g>
  <g class="dg-edge gold e-base e-comp"><path d="M887 148 V236" marker-end="url(#ga-a)"/><text x="899" y="196">each frame</text></g>
  <g class="dg-edge e-comp e-url"><path d="M791 254 H744" marker-end="url(#ga-m)"/><text x="768" y="240" text-anchor="middle">writes seed</text></g>
  <g class="dg-edge e-comp e-png"><path d="M791 284 L744 352" marker-end="url(#ga-m)"/><text x="790" y="325">toDataURL · S key</text></g>
  <g class="dg-edge dash e-url e-seed"><path d="M536 249 H135 V152" marker-end="url(#ga-m)"/><text x="330" y="241" text-anchor="middle">next visit reads the hash back — same plate</text></g>

  <!-- nodes -->
  <g class="dg-node" data-n="seed"><rect x="40" y="90" width="190" height="58" rx="8"/><text class="n" x="135" y="114" text-anchor="middle">SEED</text><text class="r" x="135" y="132" text-anchor="middle">url hash or fresh random</text></g>
  <g class="dg-node" data-n="prng"><rect x="290" y="90" width="200" height="58" rx="8"/><text class="n" x="390" y="114" text-anchor="middle">MULBERRY32 PRNG</text><text class="r" x="390" y="132" text-anchor="middle">deterministic · reseeded</text></g>
  <g class="dg-node" data-n="gen"><rect x="545" y="90" width="200" height="58" rx="8"/><text class="n" x="645" y="114" text-anchor="middle">GENERATE(SEED)</text><text class="r" x="645" y="132" text-anchor="middle">stars · nebula · names</text></g>
  <g class="dg-node" data-n="base"><rect x="795" y="90" width="185" height="58" rx="8"/><text class="n" x="887" y="114" text-anchor="middle">DRAWBASE()</text><text class="r" x="887" y="132" text-anchor="middle">static layer · offscreen</text></g>
  <g class="dg-node" data-n="comp"><rect x="795" y="240" width="185" height="58" rx="8"/><text class="n" x="887" y="264" text-anchor="middle">COMPOSITOR</text><text class="r" x="887" y="282" text-anchor="middle">base + live twinkle</text></g>
  <g class="dg-node" data-n="url"><rect x="540" y="220" width="200" height="58" rx="8"/><text class="n" x="640" y="244" text-anchor="middle">URL HASH</text><text class="r" x="640" y="262" text-anchor="middle">seed rides along, base-36</text></g>
  <g class="dg-node" data-n="png"><rect x="540" y="330" width="200" height="58" rx="8"/><text class="n" x="640" y="354" text-anchor="middle">PNG EXPORT</text><text class="r" x="640" y="372" text-anchor="middle">S saves the plate</text></g>

  <!-- callouts -->
  <text class="dg-callout" x="40" y="330">[ SAME SEED, SAME PLATE — EVERY TIME ]</text>
  <text class="dg-callout-sub" x="40" y="348">a hand-rolled seedable PRNG replaces Math.random();</text>
  <text class="dg-callout-sub" x="40" y="363">under reduced-motion the base blits once — no twinkle</text>
</svg>
