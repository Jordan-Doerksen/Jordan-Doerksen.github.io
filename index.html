<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jordan Doerksen — Tool Desk</title>
<meta name="description" content="The desk — my tools and the vetted third-party toolkit, in one searchable table.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23f6f1e7'/%3E%3Ctext x='50' y='72' font-size='64' text-anchor='middle' fill='%23b8860b'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/style.css">
<link rel="stylesheet" href="styles/desk.css">
</head>
<body class="desk">
<div class="wrap desk-wrap">

  <div class="topbar" id="topbar">
    <span class="brand">TOOL DESK ✦</span>
    <input id="q" type="search" placeholder="search everything — name, tag, port, path, category…" autocomplete="off">
    <span class="kbd">/</span>
    <span class="counts" id="counts"></span>
  </div>

  <div class="filters" id="filters"></div>

  <div class="sec" id="pins-sec">Pinned</div>
  <div class="pins" id="pins"></div>

  <div class="sec" id="mine-sec">Mine — active first</div>
  <table id="mine">
    <thead><tr>
      <th></th><th>tool</th><th>status</th><th class="hide-sm">note</th><th>port</th><th class="hide-sm">local path</th><th>links</th>
    </tr></thead>
    <tbody></tbody>
  </table>

  <div class="sec" id="toolkit-sec">Toolkit — vetted third-party</div>
  <table id="toolkit">
    <thead><tr>
      <th></th><th>tool</th><th>category</th><th class="hide-sm">what it's for</th><th class="hide-sm">get it</th><th>platform</th>
    </tr></thead>
    <tbody></tbody>
  </table>

  <footer>data: registry.json + desk.json + toolkit.js · ★ = daily driver · click any dashed mono value to copy · / focuses search · <a href="docs/legacy-front-door.html">old front door</a></footer>
</div>

<script src="data/toolkit.js"></script>
<script type="module" src="js/desk/desk.js"></script>
</body>
</html>
