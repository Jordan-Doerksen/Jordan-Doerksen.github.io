"use strict";
(function(){
//============================================================================
//  Sanctuary: Act I  — a Diablo II Act 1 slice (single file, canvas)
//  Town > Blood Moor > Den of Evil (clear quest) > Burial Grounds > Blood Raven
//============================================================================
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
let VW=0, VH=0;
function resize(){ VW=cv.width=innerWidth; VH=cv.height=innerHeight; }
addEventListener('resize',resize); resize();

// ---- helpers ----
const TAU=Math.PI*2;
const rand=(a,b)=>a+Math.random()*(b-a);
const randi=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(x1,y1,x2,y2)=>Math.hypot(x1-x2,y1-y2);
const ang=(x1,y1,x2,y2)=>Math.atan2(y2-y1,x2-x1);
function hash2(x,y){ let h=x*374761393+y*668265263; h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967295; }

const TILE=44;

// ---------------------------------------------------------------------------
//  CLASS + SKILL + MONSTER + ITEM DATA
// ---------------------------------------------------------------------------
const CLASSES={
  sorceress:{ name:'Sorceress', col:'#6fb4ff', accent:'#bfe0ff',
    str:10,dex:25,vit:10,ene:35, baseHp:40,baseMana:35, hpVit:2,manaEne:2,hpLvl:1,manaLvl:1.5,

// kind: projectile | spread | nova | melee | leap
const SKILLS={

    dmg:[8,15],per:3, pr:{sp:430,r:7,life:1.3}},

    dmg:[5,9],per:2, count:5,spread:.85, pr:{sp:360,r:5,life:.9}},
  bash:{name:'Bash',mana:2,cd:.28,kind:'melee',el:'phys',col:'#ffd27a',

  multishot:{name:'Multiple Shot',mana:5,cd:.62,kind:'spread',el:'phys',col:'#d8ffe0',
    dmg:[5,10],per:2, count:5,spread:.7, pr:{sp:480,r:4,life:.85}},
  jab:{name:'Jab',mana:2,cd:.22,kind:'melee',el:'phys',col:'#9be0a8',
    dmg:[9,15],per:3, range:58,arc:.75},

const MON={
  fallen:{name:'Fallen',hp:18,dmg:[3,6],sp:96,r:13,aggro:300,range:28,cd:1.0,xp:9,col:'#c0392b',loot:.38},
  quillrat:{name:'Quill Rat',hp:14,dmg:[3,6],sp:128,r:12,aggro:320,range:230,cd:1.5,ranged:true,xp:8,col:'#a8702f',loot:.32},
  zombie:{name:'Zombie',hp:34,dmg:[5,10],sp:52,r:16,aggro:250,range:30,cd:1.4,xp:13,col:'#5f8049',loot:.46},
  shaman:{name:'Fallen Shaman',hp:30,dmg:[4,8],sp:84,r:14,aggro:340,range:240,cd:1.9,ranged:true,heals:true,xp:20,col:'#8e44ad',loot:.62,champ:true},
  raven:{name:'Blood Raven',hp:460,dmg:[9,16],sp:135,r:21,aggro:900,range:360,cd:.66,ranged:true,boss:true,xp:240,col:'#c01535',loot:1},
};

const BASES={
  weapon:[{n:'Short Sword',d:[4,9],cls:'all'},{n:'Hand Axe',d:[5,10],cls:'all'},
          {n:'War Wand',d:[3,7],cls:'sorceress'},{n:'Short Bow',d:[4,8],cls:'amazon'},
          {n:'Spiked Club',d:[6,11],cls:'barbarian'}],
  armor:[{n:'Quilted Armor',def:9},{n:'Leather Armor',def:16},{n:'Ring Mail',def:26}],
  helm:[{n:'Cap',def:4},{n:'Skull Cap',def:9},{n:'War Helm',def:15}],
  ring:[{n:'Ring',def:0}],
};
const AFFIX=[
  {k:'str',n:'of Strength',min:2,max:6},{k:'dex',n:'of Dexterity',min:2,max:6},
  {k:'vit',n:'of Vitality',min:2,max:7},{k:'ene',n:'of Energy',min:2,max:7},
  {k:'life',n:'of the Whale',min:6,max:18},{k:'mana',n:'of the Mind',min:5,max:14},
  {k:'mindmg',n:'Jagged',min:1,max:3},{k:'maxdmg',n:'Sharp',min:2,max:5},
  {k:'def',n:'Sturdy',min:5,max:16},{k:'mf',n:'Lucky',min:5,max:15},
];
const RARITY={ normal:{n:'Normal',col:'#d8d8d8'},magic:{n:'Magic',col:'#6a86ff'},
  rare:{n:'Rare',col:'#ffe24a'},unique:{n:'Unique',col:'#c8893b'} };

// ---------------------------------------------------------------------------
//  GLOBAL STATE
// ---------------------------------------------------------------------------
const G={
  state:'title',           // title | charselect | playing | dead | victory
  time:0, panel:null,      // panel: null | 'char' | 'help'
  zone:null, zoneName:'',
  player:null,
  monsters:[], projectiles:[], items:[], parts:[], floats:[],
  cam:{x:0,y:0},
  flags:{denCleared:false, ravenDead:false},
  msg:null, msgT:0,
  selectedClass:'sorceress',
  exitLock:0, kills:0,
};
const mouse={sx:0,sy:0,wx:0,wy:0,left:false,right:false};

// ---------------------------------------------------------------------------
//  ZONE BUILDING
// ---------------------------------------------------------------------------
function makeGrid(w,h,fill){ const g=new Uint8Array(w*h); g.fill(fill); return g; }
const idx=(z,x,y)=>y*z.w+x;
function walkable(z,wx,wy){
  const tx=Math.floor(wx/TILE), ty=Math.floor(wy/TILE);
  if(tx<0||ty<0||tx>=z.w||ty>=z.h) return false;
  return z.grid[ty*z.w+tx]===1;
}
function rectWall(z,x0,y0,x1,y1){ for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)
  if(x>=0&&y>=0&&x<z.w&&y<z.h) z.grid[y*z.w+x]=0; }
function blob(z,cx_,cy_,rad){ for(let y=-rad;y<=rad;y++)for(let x=-rad;x<=rad;x++){
  if(x*x+y*y<=rad*rad+rad){ const tx=cx_+x,ty=cy_+y;
    if(tx>1&&ty>1&&tx<z.w-2&&ty<z.h-2) z.grid[ty*z.w+tx]=0; } } }

function baseZone(name,w,h,ground){
  const z={name,w,h,ground,grid:makeGrid(w,h,1),spawns:[],exits:[],npcs:[],
    decos:[],torches:[],entries:{},boss:false};
  for(let x=0;x<w;x++){ z.grid[x]=0; z.grid[(h-1)*w+x]=0; }
  for(let y=0;y<h;y++){ z.grid[y*w]=0; z.grid[y*w+w-1]=0; }
  return z;
}
function scatterRocks(z,n,minx,maxx){
  for(let i=0;i<n;i++){ const tx=randi(minx||2,maxx||z.w-3), ty=randi(2,z.h-3);
    const r=randi(1,2); blob(z,tx,ty,r);
    z.decos.push({x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,type:'rock',r:r*TILE*.7,
      seed:Math.random()}); }
}
function safeSpawn(z){ let tx,ty,t=0; do{ tx=randi(2,z.w-3); ty=randi(2,z.h-3); t++; }
  while(z.grid[ty*z.w+tx]!==1 && t<200); return {x:tx*TILE+TILE/2,y:ty*TILE+TILE/2}; }

function buildTown(){
  const z=baseZone('Rogue Encampment',24,18,'town');
  // palisade interior already open; carve nothing. east gate exit
  z.exits.push({tx:22,ty:9,to:'moor',label:'Blood Moor',entry:'town'});
  z.entries.town={x:3*TILE,y:9*TILE};
  z.entries.moor={x:21*TILE,y:9*TILE};
  // campfire torches
  z.torches.push({x:8*TILE,y:9*TILE});
  z.npcs.push({name:'Akara',role:'Heal & Mana',x:6*TILE,y:6*TILE,col:'#cdb6ff',
    line:'May the Great Eye watch over you. Be whole again.',act:'heal'});
  z.npcs.push({name:'Kashya',role:'Rogue Captain',x:6*TILE,y:12*TILE,col:'#ff9d6e',
    line:'Blood Raven was one of ours. Now she defiles the Burial Grounds. End her.'});
  z.npcs.push({name:'Charsi',role:'Blacksmith',x:11*TILE,y:6*TILE,col:'#ffd27a',
    line:'Clear the Den of Evil and the Rogues will fight beside you again.'});
  z.npcs.push({name:'Warriv',role:'Caravan',x:11*TILE,y:12*TILE,col:'#b9e08a',
    line:'The road east through the Blood Moor is the only way forward.'});
  // a few decorative tents (as solid rocks) along the top edge
  z.decos.push({x:4*TILE,y:3*TILE,type:'tent',seed:.1});
  z.decos.push({x:9*TILE,y:3*TILE,type:'tent',seed:.5});
  z.decos.push({x:14*TILE,y:3*TILE,type:'tent',seed:.8});
  return z;
}
function buildMoor(){
  const z=baseZone('Blood Moor',40,30,'moor');
  scatterRocks(z,46);
  z.exits.push({tx:1,ty:15,to:'town',label:'Rogue Encampment',entry:'moor'});
  z.exits.push({tx:38,ty:6,to:'den',label:'Den of Evil',entry:'moor'});
  z.exits.push({tx:38,ty:24,to:'burial',label:'Burial Grounds',entry:'moor'});
  z.entries.town={x:3*TILE,y:15*TILE};
  z.entries.moor={x:36*TILE,y:15*TILE};
  z.entries.den={x:36*TILE,y:6*TILE};
  z.entries.burial={x:36*TILE,y:24*TILE};
  // monster packs
  for(let i=0;i<5;i++){ const p=safeSpawn(z); spawnPack(z,p,'fallen',randi(3,5)); }
  for(let i=0;i<4;i++){ const p=safeSpawn(z); z.spawns.push({type:'quillrat',x:p.x,y:p.y}); }
  const sh=safeSpawn(z); z.spawns.push({type:'shaman',x:sh.x,y:sh.y});
  spawnPack(z,sh,'fallen',3);
  return z;
}
function buildDen(){
  // open cavern (interior starts walkable); blob() writes WALLS, so we use it to
  // bite irregular edges into the cave and drop a few interior pillars.
  const z=baseZone('Den of Evil',30,22,'cave');
  z.keep=4; z.clear=3;            // tighter clearing suits a cramped interior
  for(let i=0;i<46;i++){ const edge=randi(0,3); let tx,ty;
    if(edge===0){tx=randi(2,z.w-3);ty=randi(1,2);}
    else if(edge===1){tx=randi(2,z.w-3);ty=randi(z.h-3,z.h-2);}
    else if(edge===2){tx=randi(1,2);ty=randi(2,z.h-3);}
    else {tx=randi(z.w-3,z.w-2);ty=randi(2,z.h-3);}
    blob(z,tx,ty,randi(1,2)); }
  for(let i=0;i<6;i++){ const tx=randi(7,z.w-6),ty=randi(3,z.h-4); blob(z,tx,ty,1);
    z.decos.push({x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,type:'rock',r:TILE*0.75,seed:Math.random()}); }
  z.exits.push({tx:1,ty:11,to:'moor',label:'Blood Moor',entry:'den'});
  z.entries.den={x:3*TILE,y:11*TILE};
  if(!G.flags.denCleared){
    for(let i=0;i<4;i++){ const p=safeSpawn(z); spawnPack(z,p,'fallen',randi(2,4)); }
    for(let i=0;i<5;i++){ const p=safeSpawn(z); z.spawns.push({type:'zombie',x:p.x,y:p.y}); }
    for(let i=0;i<2;i++){ const p=safeSpawn(z); z.spawns.push({type:'shaman',x:p.x,y:p.y}); }
  }
  for(let i=0;i<7;i++){ const p=safeSpawn(z); z.torches.push({x:p.x,y:p.y}); }
  return z;
}
function buildBurial(){
  const z=baseZone('The Burial Grounds',38,28,'burial');
  scatterRocks(z,18);
  // gravestones (decorative, non-blocking)
  for(let i=0;i<26;i++){ const tx=randi(3,z.w-3),ty=randi(3,z.h-3);
    if(z.grid[ty*z.w+tx]===1) z.decos.push({x:tx*TILE+TILE/2,y:ty*TILE+TILE/2,type:'grave',seed:Math.random()}); }
  z.exits.push({tx:1,ty:14,to:'moor',label:'Blood Moor',entry:'burial'});
  z.entries.burial={x:3*TILE,y:14*TILE};
  for(let i=0;i<5;i++){ const p=safeSpawn(z); z.spawns.push({type:'zombie',x:p.x,y:p.y}); }
  if(!G.flags.ravenDead){ z.boss=true; z.bossPos={x:30*TILE,y:14*TILE}; }
  return z;
}
function spawnPack(z,p,type,n){ for(let i=0;i<n;i++)
  z.spawns.push({type,x:p.x+rand(-50,50),y:p.y+rand(-50,50)}); }

const ZONES={ town:buildTown, moor:buildMoor, den:buildDen, burial:buildBurial };

// Diablo-style entrance design: every entry/exit gets a preset clearing.
// SAFE_CLEAR = radius (tiles) carved open and stripped of decorations.
// SAFE_KEEP  = larger radius that NO creature may spawn within, so you always
//              arrive on open ground with breathing room before combat.
const SAFE_CLEAR=4, SAFE_KEEP=6;   // defaults (tiles); zones may override z.clear / z.keep
const keepR=z=>(z.keep||SAFE_KEEP)*TILE;
function clearArea(z,wx,wy,rt){ const cx_=Math.floor(wx/TILE),cy_=Math.floor(wy/TILE);
  for(let y=-rt;y<=rt;y++)for(let x=-rt;x<=rt;x++){ const tx=cx_+x,ty=cy_+y;
    if(tx>0&&ty>0&&tx<z.w-1&&ty<z.h-1 && x*x+y*y<=rt*rt+rt) z.grid[ty*z.w+tx]=1; }
  z.decos=z.decos.filter(d=>dist(d.x,d.y,wx,wy)>rt*TILE);
}
function nearSafe(z,x,y){ const r=keepR(z); for(const s of z.safe){ if(dist(x,y,s.x,s.y)<r)return true; } return false; }
// pick a random walkable cell outside every keep-out; bias toward the spawn's intended spot
function spawnAwayFromSafe(z,near){ let best=null,bestD=1e9;
  for(let t=0;t<600;t++){ const tx=randi(2,z.w-3),ty=randi(2,z.h-3);
    if(z.grid[ty*z.w+tx]!==1)continue; const wx=tx*TILE+TILE/2,wy=ty*TILE+TILE/2;
    if(nearSafe(z,wx,wy))continue;
    if(!near)return {x:wx,y:wy};
    const d=dist(wx,wy,near.x,near.y); if(d<bestD){bestD=d;best={x:wx,y:wy};} }
  return best;
}
function enterZone(name,entry){
  const z=ZONES[name]();
  G.zone=z; G.zoneName=z.name;
  // collect every entrance/exit as a protected safe point
  z.safe=[];
  for(const ex of z.exits) z.safe.push({x:ex.tx*TILE+TILE/2,y:ex.ty*TILE+TILE/2});
  for(const k in z.entries) z.safe.push({x:z.entries[k].x,y:z.entries[k].y});
  // carve the clearing (walkable + no decorations) around each safe point
  for(const s of z.safe) clearArea(z,s.x,s.y,(z.clear||SAFE_CLEAR));
  G.monsters=[]; G.projectiles=[]; G.items=[]; G.parts.length=0;
  // place creatures ONLY on walkable ground OUTSIDE every keep-out zone.
  // snap to walkable first; if that fails or lands in a keep-out, relocate.
  for(const s of z.spawns){ let p=snapWalkable(s.x,s.y);
    if(!walkable(z,p.x,p.y) || nearSafe(z,p.x,p.y)){ const alt=spawnAwayFromSafe(z,{x:s.x,y:s.y}); if(!alt)continue; p=alt; }
    addMonster(s.type,p.x,p.y); }
  if(z.boss){ const m=addMonster('raven',z.bossPos.x,z.bossPos.y); m.summonT=0; }
  const e=z.entries[entry]||z.entries[name]||{x:z.w*TILE/2,y:z.h*TILE/2};
  const sp=snapWalkable(e.x,e.y); G.player.x=sp.x; G.player.y=sp.y;
  G.player.moveT=null; G.player.combat=null; G.player.pickup=null;
  G.exitLock=0.6; sfx('zone');
  showMsg(z.name, z.name==='Rogue Encampment'?'A moment of safety.':'');
}

// ---------------------------------------------------------------------------
//  ENTITIES
// ---------------------------------------------------------------------------
function snapWalkable(x,y){
  if(G.zone&&walkable(G.zone,x,y))return {x,y};
  for(let r=1;r<10;r++)for(let a=0;a<12;a++){ const an=a/12*TAU;
    const nx=x+Math.cos(an)*r*TILE*0.7, ny=y+Math.sin(an)*r*TILE*0.7;
    if(walkable(G.zone,nx,ny))return {x:nx,y:ny}; }
  return {x,y};
}
function addMonster(type,x,y){
  const s=snapWalkable(x,y); x=s.x; y=s.y;
  const d=MON[type];
  const lvlBonus=1+(G.player?G.player.level*0.06:0);
  const m={type,d,x,y,r:d.r,
    hp:d.hp*lvlBonus,maxHp:d.hp*lvlBonus, sp:d.sp, face:0,
    state:'idle', cd:0, hurt:0, slow:0, stun:0, knock:{x:0,y:0},
    boss:!!d.boss, champ:!!d.champ, summonT:2 };
  G.monsters.push(m); return m;
}

function makePlayer(cls){
  const c=CLASSES[cls];
  const p={cls,c, level:1,xp:0,
    str:c.str,dex:c.dex,vit:c.vit,ene:c.ene, statPts:0,skillPts:1,
    x:0,y:0,r:14,face:0,sp:158,
    moveT:null,combat:null,pickup:null,
    skillLvl:{}, rightSkill:c.skills[1], cd:{},
    inv:[], equip:{weapon:null,armor:null,helm:null,ring:null},
    belt:[], gold:0, hurt:0, attackAnim:0, leapT:0, leapFrom:null,leapTo:null,
  };
  for(const s of c.skills) p.skillLvl[s]= s===c.primary?1:0;
  p.skillLvl[c.primary]=1;
  recalc(p); p.hp=p.maxHp; p.mana=p.maxMana;
  // starter potions
  for(let i=0;i<4;i++) p.belt.push({kind:'potion',pot:i<2?'hp':'mana'});
  return p;
}
function xpToNext(l){ return Math.round(80*Math.pow(l,1.55)); }
function recalc(p){
  let life=0,mana=0,def=0,bonus={str:0,dex:0,vit:0,ene:0};
  for(const k in p.equip){ const it=p.equip[k]; if(!it)continue;
    def+=it.def||0;
    for(const a of it.affixes){ if(a.k==='life')life+=a.v; else if(a.k==='mana')mana+=a.v;
      else if(a.k==='def')def+=a.v; else if(bonus[a.k]!==undefined)bonus[a.k]+=a.v; } }
  p.bonus=bonus; p.defv=def;
  const str=p.str+bonus.str, dex=p.dex+bonus.dex, vit=p.vit+bonus.vit, ene=p.ene+bonus.ene;
  p.maxHp=Math.round(p.c.baseHp+vit*p.c.hpVit+(p.level-1)*p.c.hpLvl+life);
  p.maxMana=Math.round(p.c.baseMana+ene*p.c.manaEne+(p.level-1)*p.c.manaLvl+mana);
  if(p.hp>p.maxHp)p.hp=p.maxHp; if(p.mana>p.maxMana)p.mana=p.maxMana;
}
function weaponDmg(p){ const w=p.equip.weapon; if(!w)return [1,3];
  return [w.d[0],w.d[1]]; }

// ---------------------------------------------------------------------------
//  COMBAT
// ---------------------------------------------------------------------------
function tryCast(p,skillId,tx,ty){
  const sk=SKILLS[skillId]; const lvl=p.skillLvl[skillId]||1;
  if((p.cd[skillId]||0)>G.time) return false;
  if(p.mana<sk.mana){ if(skillId===p.c.primary){} else { showFloat(p.x,p.y-30,'Low Mana','#6a86ff'); return false;} }
  if(p.mana<sk.mana) return false;
  p.mana-=sk.mana; p.cd[skillId]=G.time+sk.cd; sfx('cast');
  p.face=ang(p.x,p.y,tx,ty); p.attackAnim=.18;
  const dmg=()=>{ let lo=sk.dmg[0]+sk.per*(lvl-1), hi=sk.dmg[1]+sk.per*(lvl-1);
    if(sk.el==='phys'){ const w=weaponDmg(p); lo+=w[0]; hi+=w[1];
      const sc=(p.cls==='amazon')?(p.dex+p.bonus.dex):(p.str+p.bonus.str); lo+=sc*0.08; hi+=sc*0.12; }
    return rand(lo,hi); };
  if(sk.kind==='projectile'){ spawnProj(p.x,p.y,p.face,sk,dmg(),false); }
  else if(sk.kind==='spread'){ const n=sk.count;
    for(let i=0;i<n;i++){ const a=p.face+lerp(-sk.spread,sk.spread,n===1?.5:i/(n-1));
      spawnProjA(p.x,p.y,a,sk,dmg(),false); } }
  else if(sk.kind==='nova'){ novaHit(p.x,p.y,sk,lvl,false); }
  else if(sk.kind==='melee'){ meleeHit(p,sk,dmg); }
  else if(sk.kind==='leap'){ doLeap(p,tx,ty,sk,dmg()); }
  return true;
}
function spawnProj(x,y,a,sk,dmg,hostile){ spawnProjA(x,y,a,sk,dmg,hostile); }
function spawnProjA(x,y,a,sk,dmg,hostile){
  G.projectiles.push({x,y,vx:Math.cos(a)*sk.pr.sp,vy:Math.sin(a)*sk.pr.sp,
    r:sk.pr.r,life:sk.pr.life,col:sk.col,dmg,hostile,el:sk.el,slow:sk.slow||0});
}
function novaHit(x,y,sk,lvl,hostile){
  const targets=hostile?[G.player]:G.monsters;
  for(const t of targets){ if(t.hp<=0)continue;
    if(dist(x,y,t.x,t.y)<sk.radius+(t.r||14)){
      let d=rand(sk.dmg[0]+sk.per*(lvl-1),sk.dmg[1]+sk.per*(lvl-1));
      damage(t,d,sk.el,hostile); if(sk.slow)t.slow=sk.slow; if(sk.stun)t.stun=sk.stun; } }
  for(let i=0;i<26;i++){ const a=i/26*TAU;
    G.parts.push({x,y,vx:Math.cos(a)*sk.radius*2.6,vy:Math.sin(a)*sk.radius*2.6,
      life:.4,max:.4,col:sk.col,r:4}); }
  ring(x,y,sk.radius,sk.col);
}
function meleeHit(p,sk,dmgfn){
  for(const m of G.monsters){ if(m.hp<=0)continue;
    if(dist(p.x,p.y,m.x,m.y)<sk.range+m.r){
      const a=ang(p.x,p.y,m.x,m.y); let da=Math.abs(((a-p.face+Math.PI*3)%TAU)-Math.PI);
      if(da<sk.arc){ damage(m,dmgfn(),sk.el,false);
        if(sk.knock){ m.knock.x+=Math.cos(a)*sk.knock; m.knock.y+=Math.sin(a)*sk.knock; }
        for(let i=0;i<5;i++)blood(m.x,m.y,sk.col); } } }
  // slash arc particle
  for(let i=0;i<8;i++){ const a=p.face+lerp(-sk.arc,sk.arc,i/7);
    G.parts.push({x:p.x+Math.cos(a)*sk.range*.6,y:p.y+Math.sin(a)*sk.range*.6,
      vx:Math.cos(a)*40,vy:Math.sin(a)*40,life:.18,max:.18,col:sk.col,r:3}); }
}
function doLeap(p,tx,ty,sk,dmg){
  const d=Math.min(dist(p.x,p.y,tx,ty),sk.range); const a=ang(p.x,p.y,tx,ty);
  p.leapFrom={x:p.x,y:p.y}; p.leapTo={x:p.x+Math.cos(a)*d,y:p.y+Math.sin(a)*d};
  // clamp landing to walkable
  if(!walkable(G.zone,p.leapTo.x,p.leapTo.y)){ p.leapTo.x=p.x; p.leapTo.y=p.y; }
  p.leapT=.32; p._leapSk=sk; p._leapDmg=dmg;
}
function landLeap(p){
  const sk=p._leapSk; ring(p.x,p.y,sk.radius,sk.col);
  for(const m of G.monsters){ if(m.hp<=0)continue;
    if(dist(p.x,p.y,m.x,m.y)<sk.radius+m.r){ damage(m,p._leapDmg,sk.el,false);
      const a=ang(p.x,p.y,m.x,m.y); m.knock.x+=Math.cos(a)*sk.knock; m.knock.y+=Math.sin(a)*sk.knock; } }
  shake(6);
}
function damage(t,amt,el,hostile){
  amt=Math.max(1,Math.round(amt));
  if(hostile){ // damage to player, reduced by defense
    const red=Math.min(.6, (G.player.defv||0)/((G.player.defv||0)+120));
    amt=Math.max(1,Math.round(amt*(1-red)));
    G.player.hp-=amt; G.player.hurt=.25; shake(3); sfx('hurt');
    showFloat(G.player.x,G.player.y-26,amt,'#ff5a5a');
    blood(G.player.x,G.player.y,'#a01818');
    if(G.player.hp<=0) playerDie();
  } else {
    t.hp-=amt; t.hurt=.18; sfx('hit');
    const crit=Math.random()<0.08;
    if(crit){ t.hp-=amt; showFloat(t.x,t.y-t.r-6,Math.round(amt*2),'#ffd24a',true); }
    else showFloat(t.x,t.y-t.r-6,amt, el==='fire'?'#ff8a3a':el==='cold'?'#7ad6ff':el==='light'?'#c8a6ff':'#ffffff');
    if(t.hp<=0) monsterDie(t);
  }
}
function monsterDie(m){
  if(m.dead)return; m.dead=true; G.kills++;
  sfx(m.boss?'bossdie':'die');
  gainXp(m.d.xp);
  for(let i=0;i<14;i++)blood(m.x,m.y,m.d.col);
  if(Math.random()<m.d.loot||m.boss) dropLoot(m);
  if(m.boss){ // gold burst + guaranteed rare
    for(let k=0;k<5;k++) dropLoot(m,true);
    G.flags.ravenDead=true; setTimeout(()=>{ if(G.state==='playing')victory(); },1400);
    showMsg('Blood Raven falls','The Sisters\' Burial Grounds are cleansed.');
    shake(14);
  }
}
function playerDie(){ G.state='dead'; G.player.hp=0; shake(20); sfx('death');
  for(let i=0;i<30;i++)blood(G.player.x,G.player.y,'#7a1010'); }
function gainXp(n){ const p=G.player; p.xp+=n;
  while(p.xp>=xpToNext(p.level)){ p.xp-=xpToNext(p.level); p.level++;
    p.statPts+=5; p.skillPts+=1; recalc(p); p.hp=p.maxHp; p.mana=p.maxMana;
    sfx('level');
    showFloat(p.x,p.y-40,'LEVEL UP!','#ffe24a',true);
    for(let i=0;i<30;i++){ const a=Math.random()*TAU;
      G.parts.push({x:p.x,y:p.y,vx:Math.cos(a)*120,vy:Math.sin(a)*120-60,life:.7,max:.7,col:'#ffe24a',r:3}); } } }

// ---------------------------------------------------------------------------
//  LOOT
// ---------------------------------------------------------------------------
function dropLoot(m,force){
  const x=m.x+rand(-26,26), y=m.y+rand(-26,26);
  const roll=Math.random();
  if(!force && roll<0.4){ // gold
    G.items.push({kind:'gold',amt:randi(3,12)+G.player.level*2,x,y,bob:Math.random()*TAU}); return; }
  if(!force && roll<0.62){ // potion
    G.items.push({kind:'potion',pot:Math.random()<.6?'hp':'mana',x,y,bob:Math.random()*TAU}); return; }
  // gear
  const it=genItem(m.boss?2:0); it.x=x; it.y=y; it.bob=Math.random()*TAU; it.kind='gear';
  G.items.push(it);
}
function genItem(lvlBoost){
  const slot=pick(['weapon','armor','helm','ring']);
  let bases=BASES[slot];
  if(slot==='weapon') bases=bases.filter(b=>b.cls==='all'||b.cls===G.player.cls);
  const base=pick(bases);
  let r=Math.random()+lvlBoost*0.18;
  let rarity = r<0.5?'normal': r<0.8?'magic': r<0.96?'rare':'unique';
  const affixes=[]; const n= rarity==='normal'?0: rarity==='magic'?randi(1,2): rarity==='rare'?randi(3,4):randi(4,5);
  const pool=[...AFFIX]; let name='';
  for(let i=0;i<n;i++){ const af=pool.splice(randi(0,pool.length-1),1)[0]||pick(AFFIX);
    affixes.push({k:af.k,n:af.n,v:randi(af.min,af.max)*(rarity==='unique'?2:1)}); }
  const it={slot,base:base.n,def:base.def||0,d:base.d?[...base.d]:null,rarity,affixes};
  // names
  if(rarity==='magic'){ const pre=affixes[0]?affixes[0].n:''; name=`${base.n} ${pre}`; }
  else if(rarity==='rare'){ name=`${pick(['Gore','Doom','Skull','Raven','Grim','Hell','Blood'])} ${pick(['Bite','Brand','Shroud','Song','Bane','Veil'])}`; }
  else if(rarity==='unique'){ name=`${pick(['The Gnasher','Hellplague','Wormskull','Eye of Etlich','Nagelring'])}`; }
  else name=base.n;
  it.name=name;
  if(rarity==='unique'){ it.d&&(it.d[0]*=2,it.d[1]*=2); it.def*=2; }
  return it;
}
function pickupItem(it){
  const p=G.player;
  if(it.kind==='gold'){ p.gold+=it.amt; sfx('gold'); showFloat(p.x,p.y-30,'+'+it.amt+'g','#ffe24a'); return true; }
  if(it.kind==='potion'){ if(p.belt.length<8){ p.belt.push({kind:'potion',pot:it.pot}); sfx('pick');
    showFloat(p.x,p.y-30,it.pot==='hp'?'Healing Potion':'Mana Potion',it.pot==='hp'?'#ff5a5a':'#6a86ff'); return true; }
    return false; }
  if(p.inv.length>=24){ showFloat(p.x,p.y-30,'Inventory Full','#ff8a3a'); return false; }
  p.inv.push(it); sfx('pick'); showFloat(p.x,p.y-30,it.name,RARITY[it.rarity].col); return true;
}

// ---------------------------------------------------------------------------
//  PARTICLES / FX
// ---------------------------------------------------------------------------
function blood(x,y,col){ G.parts.push({x,y,vx:rand(-90,90),vy:rand(-90,90),
  life:rand(.25,.55),max:.55,col,r:rand(2,4)}); }
function showFloat(x,y,t,col,big){ G.floats.push({x,y,t:''+t,col,life:.9,max:.9,big}); }
function ring(x,y,r,col){ G.parts.push({x,y,ring:true,r0:8,r:r,life:.35,max:.35,col}); }
/* prefers-reduced-motion: screen shake is a pure effect — skip it entirely when set */
const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let shakeAmt=0; function shake(a){ if(REDUCED_MOTION) return; shakeAmt=Math.max(shakeAmt,a); }
function showMsg(t,sub){ G.msg={t,sub}; G.msgT=3.2; }

// ---------------------------------------------------------------------------
//  UPDATE
// ---------------------------------------------------------------------------
function update(dt){
  G.time+=dt; if(G.exitLock>0)G.exitLock-=dt;
  if(G.msgT>0)G.msgT-=dt;
  shakeAmt*=Math.pow(0.001,dt);
  const p=G.player;

  // ---- player intent ----
  if(p.leapT>0){ p.leapT-=dt; const t=1-p.leapT/.32;
    p.x=lerp(p.leapFrom.x,p.leapTo.x,t); p.y=lerp(p.leapFrom.y,p.leapTo.y,t);
    if(p.leapT<=0) landLeap(p);
  } else {
    if(p.combat && p.combat.hp>0){
      const m=p.combat; const sk=SKILLS[p.c.primary];
      const reach=(sk.kind==='melee'?sk.range:260);
      const dd=dist(p.x,p.y,m.x,m.y);
      if(dd<reach+m.r){ tryCast(p,p.c.primary,m.x,m.y); p._stuck=0; }
      else { const bx=p.x,by=p.y; moveToward(p,m.x,m.y,dt);
        // if we couldn't make progress toward the target, give up so we never soft-lock
        if(dist(p.x,p.y,bx,by)<0.4){ p._stuck=(p._stuck||0)+dt; if(p._stuck>1.2){ p.combat=null; p._stuck=0; } }
        else p._stuck=0; }
    } else if(p.combat && p.combat.hp<=0){ p.combat=null; }
    else if(p.pickup){
      const it=p.pickup;
      if(G.items.indexOf(it)<0){ p.pickup=null; }
      else if(dist(p.x,p.y,it.x,it.y)<34){ if(pickupItem(it)){ const i=G.items.indexOf(it); if(i>=0)G.items.splice(i,1);} p.pickup=null; }
      else moveToward(p,it.x,it.y,dt);
    } else if(mouse.left && !G.panel){ moveToward(p,mouse.wx,mouse.wy,dt); }
    else if(p.moveT){ if(dist(p.x,p.y,p.moveT.x,p.moveT.y)<6)p.moveT=null;
      else moveToward(p,p.moveT.x,p.moveT.y,dt); }
  }
  // right skill hold
  if(mouse.right && !G.panel && p.leapT<=0){ tryCast(p,p.rightSkill,mouse.wx,mouse.wy); }
  if(p.attackAnim>0)p.attackAnim-=dt;
  if(p.hurt>0)p.hurt-=dt;
  // auto gold pickup
  for(let i=G.items.length-1;i>=0;i--){ const it=G.items[i];
    if(it.kind==='gold'&&dist(p.x,p.y,it.x,it.y)<30){ pickupItem(it); G.items.splice(i,1); } }
  // regen
  p.mana=Math.min(p.maxMana,p.mana+dt*(2+p.ene*0.05));
  p.hp=Math.min(p.maxHp,p.hp+dt*(0.4+p.vit*0.02));

  // ---- zone exits ----
  for(const ex of G.zone.exits){ const exx=ex.tx*TILE+TILE/2, exy=ex.ty*TILE+TILE/2;
    if(G.exitLock<=0 && dist(p.x,p.y,exx,exy)<TILE*0.9){ enterZone(ex.to,ex.entry); return; } }

  // ---- monsters ----
  for(const m of G.monsters){ if(m.hp<=0)continue; updateMonster(m,dt); }
  G.monsters=G.monsters.filter(m=>m.hp>0||m.deathT>0);

  // den clear check
  if(G.zone.name==='Den of Evil' && !G.flags.denCleared && G.monsters.filter(m=>m.hp>0).length===0){
    G.flags.denCleared=true; p.skillPts+=1;
    showMsg('Den of Evil Cleared','Charsi rewards you — +1 Skill Point. Return to town.');
    showFloat(p.x,p.y-40,'+1 Skill Point','#ffe24a',true);
  }

  // ---- projectiles ----
  for(let i=G.projectiles.length-1;i>=0;i--){ const pr=G.projectiles[i];
    pr.x+=pr.vx*dt; pr.y+=pr.vy*dt; pr.life-=dt;
    G.parts.push({x:pr.x,y:pr.y,vx:0,vy:0,life:.18,max:.18,col:pr.col,r:pr.r*.7});
    let hit=false;
    if(!walkable(G.zone,pr.x,pr.y))hit=true;
    if(pr.hostile){ if(dist(pr.x,pr.y,p.x,p.y)<p.r+pr.r){ damage(p,pr.dmg,pr.el,true); hit=true; } }
    else { for(const m of G.monsters){ if(m.hp<=0)continue;
      if(dist(pr.x,pr.y,m.x,m.y)<m.r+pr.r){ damage(m,pr.dmg,pr.el,false);
        if(pr.slow)m.slow=pr.slow; hit=true; break; } } }
    if(hit||pr.life<=0){ for(let k=0;k<6;k++)G.parts.push({x:pr.x,y:pr.y,
      vx:rand(-60,60),vy:rand(-60,60),life:.25,max:.25,col:pr.col,r:2}); G.projectiles.splice(i,1); }
  }
  // ---- particles / floats ----
  for(let i=G.parts.length-1;i>=0;i--){ const a=G.parts[i]; a.life-=dt;
    if(a.ring){ a.r0=lerp(a.r0,a.r,1-a.life/a.max); } else { a.x+=a.vx*dt; a.y+=a.vy*dt; a.vx*=.92; a.vy*=.92; }
    if(a.life<=0)G.parts.splice(i,1); }
  for(let i=G.floats.length-1;i>=0;i--){ const f=G.floats[i]; f.life-=dt; f.y-=dt*30;
    if(f.life<=0)G.floats.splice(i,1); }

  // ---- camera ----
  G.cam.x=lerp(G.cam.x,p.x-VW/2,0.12);
  G.cam.y=lerp(G.cam.y,p.y-VH/2,0.12);
}

function moveToward(e,tx,ty,dt){
  const a=ang(e.x,e.y,tx,ty); const sp=e.sp*(e.slow>0?0.5:1)*dt;
  e.face=a;
  // try the direct angle, then progressively wider deviations to slip around rocks
  for(const off of [0,0.4,-0.4,0.9,-0.9,1.45,-1.45]){
    const aa=a+off, nx=e.x+Math.cos(aa)*sp, ny=e.y+Math.sin(aa)*sp;
    if(walkable(G.zone,nx,ny)){ e.x=nx; e.y=ny; return; }
  }
  // last resort: pure axis slide
  const nx=e.x+Math.cos(a)*sp, ny=e.y+Math.sin(a)*sp;
  if(walkable(G.zone,nx,e.y))e.x=nx; else if(walkable(G.zone,e.x,ny))e.y=ny;
}
function updateMonster(m,dt){
  const p=G.player;
  if(m.slow>0)m.slow-=dt; if(m.stun>0){ m.stun-=dt; return; }
  if(m.hurt>0)m.hurt-=dt;
  if(m.cd>0)m.cd-=dt;
  // knockback
  if(Math.abs(m.knock.x)>1||Math.abs(m.knock.y)>1){
    const nx=m.x+m.knock.x*dt*10, ny=m.y+m.knock.y*dt*10;
    if(walkable(G.zone,nx,ny)){ m.x=nx; m.y=ny; } m.knock.x*=.8; m.knock.y*=.8; }
  const dp=dist(m.x,m.y,p.x,p.y);
  if(m.state==='idle'){ if(dp<m.d.aggro){ m.state='chase'; sfx('growl'); } }
  if(m.state==='chase'){
    const eng=m.d.ranged? m.d.range*0.8 : m.d.range;
    if(dp>eng){ moveToward(m,p.x,p.y,dt); }
    else { m.face=ang(m.x,m.y,p.x,p.y);
      if(m.cd<=0){ m.cd=m.d.cd; monsterAttack(m); } }
  }
  // shaman heal aura
  if(m.d.heals){ m.healT=(m.healT||0)-dt; if(m.healT<=0){ m.healT=2.5;
    for(const o of G.monsters){ if(o!==m&&o.hp>0&&o.hp<o.maxHp&&dist(m.x,m.y,o.x,o.y)<160){
      o.hp=Math.min(o.maxHp,o.hp+8); showFloat(o.x,o.y-o.r,'+8','#74e08a'); } } } }
  // boss summons
  if(m.boss){ m.summonT-=dt;
    if(m.summonT<=0 && G.monsters.filter(z=>z.type==='zombie').length<6){ m.summonT=4.5;
      for(let i=0;i<2;i++){ const a=Math.random()*TAU;
        addMonster('zombie',m.x+Math.cos(a)*60,m.y+Math.sin(a)*60); }
      showFloat(m.x,m.y-m.r-10,'Rise!','#c01535'); } }
}
function monsterAttack(m){
  const p=G.player;
  if(m.d.ranged){ const a=ang(m.x,m.y,p.x,p.y);
    const sk={pr:{sp:m.boss?420:300,r:m.boss?7:5,life:2},col:m.boss?'#ff5a2a':'#cf6acf',el:'phys'};
    const dmg=rand(m.d.dmg[0],m.d.dmg[1])*(1+G.player.level*0.05);
    if(m.boss){ for(let i=-1;i<=1;i++) spawnProjA(m.x,m.y,a+i*0.18,sk,dmg,true); }
    else spawnProjA(m.x,m.y,a,sk,dmg,true);
  } else { if(dist(m.x,m.y,p.x,p.y)<m.d.range+p.r+6){
    damage(p,rand(m.d.dmg[0],m.d.dmg[1])*(1+G.player.level*0.05),'phys',true); } }
}

// ---------------------------------------------------------------------------
//  RENDER
// ---------------------------------------------------------------------------
const GROUND={ town:'#2b2519', moor:'#26301f', cave:'#1a140f', burial:'#222421' };
function render(){
  cx.clearRect(0,0,VW,VH);
  if(G.state==='title'){ drawTitle(); if(G.panel==='settings')drawSettings(); return; }
  if(G.state==='charselect'){ drawCharSelect(); return; }
  // world
  cx.save();
  let sx=0,sy=0; if(shakeAmt>0.3){ sx=rand(-shakeAmt,shakeAmt); sy=rand(-shakeAmt,shakeAmt); }
  cx.translate(-Math.round(G.cam.x)+sx,-Math.round(G.cam.y)+sy);
  drawZone();
  // ground items
  for(const it of G.items)drawItem(it);
  // entities sorted by y
  const ents=[...G.monsters.filter(m=>m.hp>0),G.player];
  ents.sort((a,b)=>a.y-b.y);
  for(const e of ents){ if(e===G.player)drawPlayer(); else drawMonster(e); }
  for(const pr of G.projectiles)drawProj(pr);
  drawParts();
  drawFloats();
  drawExitLabels();
  cx.restore();
  // overlays
  drawVignette();
  if(G.state==='playing'||G.state==='dead'||G.state==='victory') drawHUD();
  if(G.panel==='char')drawCharPanel();
  if(G.panel==='help')drawHelp();
  if(G.panel==='settings')drawSettings();
  if(G.msgT>0)drawZoneMsg();
  if(G.state==='dead')drawDead();
  if(G.state==='victory')drawVictory();
  drawCursor();
}
function inView(x,y,pad){ pad=pad||80; return x>G.cam.x-pad&&x<G.cam.x+VW+pad&&y>G.cam.y-pad&&y<G.cam.y+VH+pad; }

function drawZone(){
  const z=G.zone; const base=GROUND[z.ground];
  const x0=Math.max(0,Math.floor(G.cam.x/TILE)), y0=Math.max(0,Math.floor(G.cam.y/TILE));
  const x1=Math.min(z.w,Math.ceil((G.cam.x+VW)/TILE)+1), y1=Math.min(z.h,Math.ceil((G.cam.y+VH)/TILE)+1);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
    const wlk=z.grid[y*z.w+x]===1; const n=hash2(x,y);
    if(wlk){ const sh=Math.floor(n*22-8); cx.fillStyle=shade(base,sh);
      cx.fillRect(x*TILE,y*TILE,TILE+1,TILE+1);
      if(n>0.93){ cx.fillStyle='rgba(0,0,0,.18)'; cx.fillRect(x*TILE+6,y*TILE+6,TILE-12,TILE-12);} }
    else { cx.fillStyle= z.ground==='cave'?'#0a0806': z.ground==='town'?'#1c1810':'#12160e';
      cx.fillRect(x*TILE,y*TILE,TILE+1,TILE+1);
      cx.fillStyle='rgba(0,0,0,.4)'; cx.fillRect(x*TILE+3,y*TILE+3,TILE-6,TILE-6); }
  }
  // faint safe-landing rings so entrances/exits read as cleared ground
  if(z.safe)for(const s of z.safe){ if(!inView(s.x,s.y))continue;
    const g=cx.createRadialGradient(s.x,s.y,SAFE_CLEAR*TILE*0.4,s.x,s.y,SAFE_CLEAR*TILE);
    g.addColorStop(0,'rgba(150,170,150,0.05)'); g.addColorStop(1,'rgba(0,0,0,0)');
    cx.fillStyle=g; cx.beginPath(); cx.arc(s.x,s.y,SAFE_CLEAR*TILE,0,TAU); cx.fill(); }
  // decorations
  for(const d of z.decos){ if(!inView(d.x,d.y))continue; drawDeco(d); }
  // torches
  for(const t of z.torches){ if(!inView(t.x,t.y))continue; drawTorch(t); }
  // npcs
  for(const npc of z.npcs){ if(!inView(npc.x,npc.y))continue; drawNPC(npc); }
}
function drawDeco(d){

function drawMonster(m){
  const x=m.x,y=m.y,r=m.r,d=m.d;

  else if(m.type==='quillrat'){ cx.fillStyle=d.col; cx.beginPath(); cx.ellipse(x,y,r,r*.7,0,0,TAU); cx.fill();
    cx.strokeStyle='#5a3a1a'; cx.lineWidth=2; for(let i=0;i<8;i++){ const a=i/8*TAU;
      cx.beginPath(); cx.moveTo(x+Math.cos(a)*r*.6,y+Math.sin(a)*r*.5); cx.lineTo(x+Math.cos(a)*r*1.5,y+Math.sin(a)*r*1.3); cx.stroke(); } }
  else if(m.type==='zombie'){ cx.fillStyle=d.col; cx.beginPath(); cx.moveTo(x-r,y+r*.8); cx.quadraticCurveTo(x,y-r*1.2,x+r,y+r*.8); cx.closePath(); cx.fill();
    cx.fillStyle='#3e5230'; cx.beginPath(); cx.arc(x,y-r*.6,r*.45,0,TAU); cx.fill();
    cx.fillStyle='#9aff6a'; cx.fillRect(x-r*.3,y-r*.7,2,2); cx.fillRect(x+r*.1,y-r*.7,2,2); }
  else if(m.type==='shaman'){ cx.fillStyle=d.col; cx.beginPath(); cx.moveTo(x-r,y+r*.8); cx.quadraticCurveTo(x,y-r*1.5,x+r,y+r*.8); cx.closePath(); cx.fill();

    cx.beginPath(); cx.arc(x,y,r*1.8,0,TAU); cx.fill(); }
  else if(m.type==='raven'){ // boss
    const gf=.5+Math.sin(G.time*4)*.3;
    let g=cx.createRadialGradient(x,y,0,x,y,r*3); g.addColorStop(0,'rgba(200,20,50,'+(.4*gf)+')'); g.addColorStop(1,'rgba(120,0,20,0)');
    cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,r*3,0,TAU); cx.fill();
    cx.fillStyle='#1a0a0e'; cx.beginPath(); cx.moveTo(x-r,y+r); cx.quadraticCurveTo(x,y-r*1.8,x+r,y+r); cx.closePath(); cx.fill();
    cx.fillStyle=d.col; cx.beginPath(); cx.arc(x,y-r*.9,r*.5,0,TAU); cx.fill();

  } else { cx.fillStyle=d.col; cx.beginPath(); cx.arc(x,y,r,0,TAU); cx.fill(); }

    cx.fillText(d.name,x,y-r-16); }

  const fy=y+r-2*r*frac; const g=cx.createLinearGradient(0,fy,0,y+r);
  g.addColorStop(0,c1); g.addColorStop(1,c2); cx.fillStyle=g; cx.fillRect(x-r,fy,r*2,2*r);
  cx.fillStyle='rgba(255,255,255,.12)'; cx.beginPath(); cx.ellipse(x-r*.3,fy+r*.2,r*.5,r*.2,0,0,TAU); cx.fill();
  cx.restore();
  cx.strokeStyle='#2a2014'; cx.lineWidth=4; cx.beginPath(); cx.arc(x,y,r,0,TAU); cx.stroke();

function drawSkillSlot(x,y,s,skillId,key,clickable){ const sk=SKILLS[skillId];

function skillIcon(x,y,r,sk){ cx.save();
  if(sk.kind==='projectile'||sk.kind==='spread'){ cx.strokeStyle=sk.col; cx.lineWidth=3; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(x-r,y+r*.4); cx.lineTo(x+r,y-r*.4); cx.stroke();
    cx.fillStyle=sk.col; cx.beginPath(); cx.arc(x+r,y-r*.4,3,0,TAU); cx.fill(); }
  else if(sk.kind==='nova'){ cx.strokeStyle=sk.col; cx.lineWidth=2.5;
    cx.beginPath(); cx.arc(x,y,r,0,TAU); cx.stroke(); cx.beginPath(); cx.arc(x,y,r*.5,0,TAU); cx.stroke(); }
  else if(sk.kind==='melee'){ cx.strokeStyle=sk.col; cx.lineWidth=3; cx.lineCap='round';
    cx.beginPath(); cx.arc(x,y,r,-0.8,0.8); cx.stroke(); }
  else if(sk.kind==='leap'){ cx.fillStyle=sk.col; cx.beginPath();
    for(let i=0;i<8;i++){ const a=i/8*TAU, rr=i%2?r:r*.5; cx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr);} cx.closePath(); cx.fill(); }
  cx.restore();
}

function shade(hex,amt){ const c=h2rgb(hex); return 'rgb('+clamp(c[0]+amt,0,255)+','+clamp(c[1]+amt,0,255)+','+clamp(c[2]+amt,0,255)+')'; }
function hexA(hex,a){ if(hex[0]!=='#')return hex; const c=h2rgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function h2rgb(h){ h=h.replace('#',''); if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }

const SETTINGS_KEY='diablo-act1.settings';   // own key — never touches other saves
const settings=(function(){ try{ const s=JSON.parse(localStorage.getItem(SETTINGS_KEY));
  if(s&&typeof s==='object') return {sfx:s.sfx!==false, music:s.music!==false};
}catch(err){} return {sfx:true,music:true}; })();

let AC=null,sfxGain=null,musicGain=null,noiseBuf=null,music=null;
function audioUnlock(){
  if(!AC){
    const Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx)return;
    AC=new Ctx();
    sfxGain=AC.createGain(); sfxGain.gain.value=0.5; sfxGain.connect(AC.destination);
    musicGain=AC.createGain(); musicGain.gain.value=0.12; musicGain.connect(AC.destination); // music sits well under sfx
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    if(settings.music)startMusic();
  }
  if(AC.state==='suspended')AC.resume();
}
function tone(freq,dur,type,vol,slideTo,delay){
  if(!AC)return; const t0=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(sfxGain); o.start(t0); o.stop(t0+dur+0.05);
}
function noiseHit(dur,vol,fFrom,fTo,fType,delay){
  if(!AC)return; const t0=AC.currentTime+(delay||0);
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type=fType||'lowpass';
  f.frequency.setValueAtTime(fFrom,t0);
  if(fTo)f.frequency.exponentialRampToValueAtTime(fTo,t0+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  s.connect(f); f.connect(g); g.connect(sfxGain); s.start(t0); s.stop(t0+dur+0.05);
}
const SFX={
  cast:   ()=>{ noiseHit(.09,.05,900,2400,'bandpass'); },                                    // soft skill whoosh
  hit:    ()=>{ tone(rand(90,120),.12,'triangle',.20,55); noiseHit(.08,.10,700,240); },      // hit thud
  hurt:   ()=>{ tone(75,.18,'triangle',.28,48); noiseHit(.14,.14,400,150); },                // player takes a hit
  die:    ()=>{ tone(rand(120,150),.28,'sawtooth',.15,40); noiseHit(.22,.12,600,120); },     // monster death
  growl:  ()=>{ tone(rand(60,85),.3,'sawtooth',.13,45); noiseHit(.25,.07,300,90); },         // aggro growl
  gold:   ()=>{ tone(1150,.07,'square',.05); tone(1500,.09,'square',.05,null,.055); },       // coin chime
  pick:   ()=>{ tone(520,.08,'triangle',.10,700); },                                         // item pickup
  potion: ()=>{ tone(300,.09,'sine',.16,180); tone(240,.1,'sine',.14,140,.09);
                tone(190,.12,'sine',.12,110,.19); },                                         // glug glug
  level:  ()=>{ tone(261.6,.5,'triangle',.14); tone(392,.5,'triangle',.12,null,.12);
                tone(523.3,.7,'triangle',.12,null,.24);
                noiseHit(.6,.04,800,3000,'bandpass',.1); },                                  // level-up swell
  zone:   ()=>{ tone(65,.8,'sine',.11,50); noiseHit(.7,.04,200,60); },                       // zone-enter swell
  click:  ()=>{ tone(640,.05,'square',.05); },                                               // ui tick
  death:  ()=>{ tone(160,1.1,'sawtooth',.18,38); noiseHit(1.0,.10,500,80); },                // you died
  victory:()=>{ tone(220,.9,'triangle',.14); tone(261.6,.9,'triangle',.12,null,.15);
                tone(329.6,1.1,'triangle',.12,null,.3); },                                   // minor resolve
  bossdie:()=>{ tone(100,1.2,'sawtooth',.2,30); noiseHit(1.1,.14,700,60); },                 // Blood Raven falls
};
const sfxLast={}; const SFX_GAP={hit:50,cast:60,growl:300};
function sfx(name){
  if(!settings.sfx||!AC||AC.state!=='running')return;
  const now=performance.now(), gap=SFX_GAP[name]||120;
  if(sfxLast[name]&&now-sfxLast[name]<gap)return;
  sfxLast[name]=now;
  if(SFX[name])SFX[name]();
}
// ---- music: slow dark ambient drone (A minor, continuous — no loop seams) ----
function startMusic(){
  if(!AC||music)return;
  const t0=AC.currentTime;
  const out=AC.createGain(); out.gain.setValueAtTime(0.0001,t0);
  out.gain.exponentialRampToValueAtTime(1,t0+4);            // slow fade-in
  out.connect(musicGain);
  music={nodes:[],out};
  // deep root drone: detuned saw pair + a fifth, through a dark lowpass
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=220; lp.Q.value=0.7; lp.connect(out);
  const mk=(freq,type,det,vol)=>{ const o=AC.createOscillator(); o.type=type;
    o.frequency.value=freq; o.detune.value=det;
    const g=AC.createGain(); g.gain.value=vol; o.connect(g); g.connect(lp);
    o.start(); music.nodes.push(o); return g; };
  mk(55,'sawtooth',-6,.20);        // A1
  mk(55,'sawtooth',7,.20);         // A1 detuned
  mk(82.4,'triangle',0,.14);       // E2 — the fifth
  const thirdG=mk(130.8,'sine',0,.025);  // C3 — minor third, swells in and out
  // slow LFO breathing the filter cutoff (~20 s cycle)
  const lfo1=AC.createOscillator(); lfo1.frequency.value=0.05;
  const lfo1G=AC.createGain(); lfo1G.gain.value=90;
  lfo1.connect(lfo1G); lfo1G.connect(lp.frequency); lfo1.start(); music.nodes.push(lfo1);
  // slower LFO fading the minor third (~48 s cycle)
  const lfo2=AC.createOscillator(); lfo2.frequency.value=0.021;
  const lfo2G=AC.createGain(); lfo2G.gain.value=.025;
  lfo2.connect(lfo2G); lfo2G.connect(thirdG.gain); lfo2.start(); music.nodes.push(lfo2);
  // faint wind: looped noise through a slowly wandering bandpass
  const ns=AC.createBufferSource(); ns.buffer=noiseBuf; ns.loop=true;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=420; bp.Q.value=1.6;
  const ng=AC.createGain(); ng.gain.value=.045;
  const lfo3=AC.createOscillator(); lfo3.frequency.value=0.033;
  const lfo3G=AC.createGain(); lfo3G.gain.value=160;
  lfo3.connect(lfo3G); lfo3G.connect(bp.frequency); lfo3.start(); music.nodes.push(lfo3);
  ns.connect(bp); bp.connect(ng); ng.connect(out); ns.start(); music.nodes.push(ns);
}
function stopMusic(){
  if(!music)return; const m=music; music=null;
  const t=AC.currentTime;
  m.out.gain.cancelScheduledValues(t);
  m.out.gain.setValueAtTime(Math.max(0.0001,m.out.gain.value),t);
  m.out.gain.exponentialRampToValueAtTime(0.0001,t+0.6);    // fade out, then tear down
  setTimeout(()=>{ for(const n of m.nodes){ try{n.stop();}catch(err){} } m.out.disconnect(); },700);
}
function toggleSfx(){ settings.sfx=!settings.sfx; saveSettings(); if(settings.sfx)sfx('click'); }
function toggleMusic(){ settings.music=!settings.music; saveSettings();
  if(settings.music){ if(AC)startMusic(); } else stopMusic(); }

// ---------------------------------------------------------------------------
//  INPUT
// ---------------------------------------------------------------------------
function screenToWorld(){ mouse.wx=mouse.sx+G.cam.x; mouse.wy=mouse.sy+G.cam.y; }
cv.addEventListener('mousemove',e=>{ const r=cv.getBoundingClientRect();
  mouse.sx=e.clientX-r.left; mouse.sy=e.clientY-r.top; screenToWorld(); });
cv.addEventListener('mousedown',e=>{ e.preventDefault();
  audioUnlock();   // autoplay law: audio only exists after a user gesture
  if(e.button===0)mouse.left=true; if(e.button===2)mouse.right=true;
  handleClick(e.button); });
cv.addEventListener('mouseup',e=>{ if(e.button===0)mouse.left=false; if(e.button===2)mouse.right=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());

function uiAt(x,y){ for(let i=UIBTN.length-1;i>=0;i--){ const b=UIBTN[i];
  if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b; } return null; }

function handleClick(btn){
  const b=uiAt(mouse.sx,mouse.sy);
  if(b)sfx('click');
  // ---- settings panel (any state) ----
  if(G.panel==='settings'){ if(b){
    if(b.act==='togglesfx')toggleSfx();
    else if(b.act==='togglemusic')toggleMusic();
    else if(b.act==='closesettings')G.panel=null; } return; }
  // ---- menu states ----
  if(G.state==='title'){ if(b&&b.act==='start')G.state='charselect';
    else if(b&&b.act==='settings')G.panel='settings'; return; }
  if(G.state==='charselect'){ if(b){ if(b.act==='selclass')G.selectedClass=b.k;
    else if(b.act==='begin')startGame(); } return; }
  if(G.state==='dead'){ if(b&&b.act==='resurrect'){ G.player.hp=G.player.maxHp; G.player.mana=G.player.maxMana;
    G.state='playing'; enterZone('town','town'); } return; }
  if(G.state==='victory'){ if(b&&b.act==='restart'){ resetAll(); } return; }
  // ---- panels ----
  if(G.panel==='char'){ if(b)panelAction(b); return; }
  if(G.panel==='help'){ return; }
  if(btn!==0)return;
  // ---- world left click: choose target ----
  const p=G.player;
  // npc click (town heal)
  for(const npc of G.zone.npcs){ if(dist(mouse.wx,mouse.wy,npc.x,npc.y)<26 && dist(p.x,p.y,npc.x,npc.y)<90){
    if(npc.act==='heal'){ p.hp=p.maxHp; p.mana=p.maxMana; showFloat(p.x,p.y-30,'Restored','#7ad6ff'); }
    showMsg(npc.name,npc.line); return; } }
  // monster?
  let tgt=null,best=1e9;
  for(const m of G.monsters){ if(m.hp<=0)continue; const dd=dist(mouse.wx,mouse.wy,m.x,m.y);
    if(dd<m.r+14&&dd<best){ best=dd; tgt=m; } }
  if(tgt){ p.combat=tgt; p.pickup=null; p.moveT=null; return; }
  // item?
  let it=null; best=1e9;
  for(const i of G.items){ const dd=dist(mouse.wx,mouse.wy,i.x,i.y);
    if(dd<22&&dd<best){ best=dd; it=i; } }
  if(it){ p.pickup=it; p.combat=null; p.moveT=null; return; }
  // move
  p.combat=null; p.pickup=null; p.moveT={x:mouse.wx,y:mouse.wy};
}
function panelAction(b){ const p=G.player;
  if(b.act==='stat'&&p.statPts>0){ p[b.k]++; p.statPts--; recalc(p); }
  else if(b.act==='skill'&&p.skillPts>0){ p.skillLvl[b.k]++; p.skillPts--; }
  else if(b.act==='bind'){ p.rightSkill=b.s; }
  else if(b.act==='equip'){ const it=p.inv[b.i]; if(!it)return;
    const slot=it.slot; const old=p.equip[slot]; p.equip[slot]=it; p.inv.splice(b.i,1);
    if(old)p.inv.push(old); recalc(p); }
  else if(b.act==='unequip'){ const it=p.equip[b.s]; if(it&&p.inv.length<24){ p.inv.push(it); p.equip[b.s]=null; recalc(p); } }
}
addEventListener('keydown',e=>{
  audioUnlock();   // autoplay law: audio only exists after a user gesture
  const k=e.key.toLowerCase();
  // settings panel is keyboard-operable from anywhere it's open
  if(G.panel==='settings'){
    if(k==='s')toggleSfx(); else if(k==='m')toggleMusic();
    else if(k==='escape'||k==='o')G.panel=null;
    return; }
  if(k==='o'&&(G.state==='title'||G.state==='playing')){ G.panel='settings'; return; }
  if(G.state!=='playing'&&G.state!=='dead'&&G.state!=='victory')return;
  if(k==='i'||k==='c'){ G.panel=G.panel==='char'?null:'char'; }
  else if(k==='h'){ G.panel=G.panel==='help'?null:'help'; }
  else if(k==='escape'){ G.panel=null; }
  else if(k==='1')bindSkillByIndex(0);
  else if(k==='2')bindSkillByIndex(1);
  else if(k==='3')bindSkillByIndex(2);
  else if(k==='q')drinkPotion('hp');
  else if(k==='e')drinkPotion('mana');
});
function bindSkillByIndex(i){ const sk=G.player.c.skills[i]; if(sk&&sk!==G.player.c.primary)G.player.rightSkill=sk;
  else if(sk)G.player.rightSkill=sk; }
function drinkPotion(type){ const p=G.player;
  for(let i=0;i<p.belt.length;i++){ if(p.belt[i]&&p.belt[i].pot===type){
    if(type==='hp'){ p.hp=Math.min(p.maxHp,p.hp+p.maxHp*0.5); showFloat(p.x,p.y-30,'+Health','#ff6a6a'); }
    else { p.mana=Math.min(p.maxMana,p.mana+p.maxMana*0.6); showFloat(p.x,p.y-30,'+Mana','#6a9aff'); }
    sfx('potion'); p.belt.splice(i,1); return; } }
}

// ---------------------------------------------------------------------------
//  FLOW
// ---------------------------------------------------------------------------
function startGame(){ G.player=makePlayer(G.selectedClass); G.flags={denCleared:false,ravenDead:false};
  G.kills=0; G.state='playing'; G.panel='help'; enterZone('town','town');
  setTimeout(()=>{ if(G.panel==='help')G.panel=null; },4000);
}
function victory(){ G.state='victory'; sfx('victory'); }
function resetAll(){ G.state='title'; G.panel=null; G.monsters=[]; G.items=[]; G.projectiles=[]; }

// ---------------------------------------------------------------------------
//  MAIN LOOP
// ---------------------------------------------------------------------------
let last=performance.now();
function loop(now){ requestAnimationFrame(loop);
  let dt=(now-last)/1000; last=now; if(dt>0.05)dt=0.05;
  if(G.state==='playing'&&!G.panel)update(dt);
  else if(G.state==='playing'&&G.panel){ // still animate floats/parts subtly? keep paused
  }
  render();
}
requestAnimationFrame(loop);
})();
</script>
